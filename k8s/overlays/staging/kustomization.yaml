apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- namespace.yaml
# - dmarc-exporter-sealedsecret.yaml  # gere o seu com kubeseal (ver README)
# - deployment.yaml

namespace: staging-dmarc-exporter

commonLabels:
  app: prod-dmarc-exporter

images:
- name: dmarc-exporter
  newName: registry.example.com/dmarc-exporter
  newTag: latest

patches:
- patch: |-
    - op: replace
      path: /spec/suspend
      value: false
  target:
    kind: CronJob
    name: dmarc-exporter-cronjob
